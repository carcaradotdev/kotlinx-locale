name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The coverage job edits one comment on the pull request rather than adding a
  # new one per run. Read-only for a fork's token, which the job handles by
  # falling back to the run summary; see the note there.
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Before Gradle, because it needs nothing from it and a missing license
      # header should not wait twenty minutes behind a Kotlin compile to be
      # reported. The header is read out of LICENSE, so this also fails when
      # someone edits LICENSE and leaves the source tree behind.
      - name: Check the Apache license header on every source file
        run: python3 scripts/license_header.py check
      - name: Check formatting
        run: ./gradlew ktlintCheck
      - name: Check that hand-written code names no specific enum entry
        run: ./gradlew checkLayeringRule
      - name: Validate the convention plugins and task declarations
        run: ./gradlew -p build-logic validatePlugins
      # The second graph is not redundant. The test framework's only build-level
      # hook is `gradle.taskGraph.whenReady`, which never fires for `:help`, so
      # a graph without a test task in it cannot tell you whether test
      # configuration round-trips.
      - name: Check the configuration cache round-trips
        run: |
          ./gradlew :help --configuration-cache && ./gradlew :help --configuration-cache
          ./gradlew :kotlinx-locale-types:jvmTest --configuration-cache
          ./gradlew :kotlinx-locale-types:jvmTest --configuration-cache

  size:
    name: size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check every artifact against its gzipped budget
        run: ./gradlew sizeReport

  tooling:
    # The build-time modules, whose tests the target matrix below cannot reach.
    # Those jobs ask for `jvmTest`, which is a Kotlin Multiplatform task name;
    # :codegen, the emitters and the Gradle plugin are plain JVM projects and
    # their task is `test`, so nothing here ran in CI at all until this job
    # existed. That covered the plugin's feature-to-table closures, which is how
    # four of them shipped generating source that did not compile.
    name: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the generator, the emitters and the Gradle plugin
        run: |
          ./gradlew \
            :codegen:test \
            :kotlinx-locale-codegen-emitters:test \
            :kotlinx-locale-gradle-plugin:test

  conformance:
    # The live ICU comparison, across every locale the library ships rather than
    # the thirty a committed golden can afford.
    #
    # Needs the ICU4J jar and nothing else: no CLDR clone, which is what lets it
    # run here at all, since `codegen/repos` is hundreds of megabytes and CI
    # never clones it. Runs beside the target matrix rather than inside it, and
    # the matrix is the longer job, so this does not extend the critical path.
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reports without blocking, and the reason is in conformance/ledger: the
    # first generated ledger carries 1602 rows nobody has classified, and every
    # one of them fails the build by design until someone writes down whether it
    # is an ICU defect or a deliberate divergence.
    #
    # Reporting without gating is the honest state while that triage is
    # outstanding. Delete this line once the ledger has no TODO rows left; the
    # job is then a real gate and a new divergence fails the PR that caused it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compare every shipped table against ICU4J
        run: ./gradlew :conformance-icu:test

  coverage:
    # Line and branch coverage over the hand-written code, which is 157 of this
    # build's 1160 main source files. The other 1003 are generated tables and are
    # filtered out in `kotlinx-locale-coverage`; a number that counted them would
    # move when CLDR adds a locale and would mean nothing either way.
    #
    # Kover instruments JVM bytecode, so this measures the `jvm` target. The
    # sources are common, so a covered line is covered on every target; what it
    # cannot see is an `actual` in a native or JS source set.
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Measure coverage
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Read the counters
        id: kover
        run: python3 .github/scripts/kover_summary.py

      # A different question from the one above, and the one a locale library is
      # actually judged on: how much of the shipped data was compared against
      # ICU or CLDR. Line coverage cannot answer it, because formatting thirty
      # locales runs the same code as formatting eleven hundred.
      - name: Measure oracle coverage
        run: |
          python3 .github/scripts/oracle_coverage.py
          cat oracle-coverage.md >> coverage-summary.md

      # Always written, needs no token, and works for a fork. This is the copy
      # that is guaranteed to exist.
      - name: Write the run summary
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork gets a read-only token, so this step cannot
      # run there and is skipped rather than failed. The summary above already
      # carries the same table.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-summary.md', 'utf8');
            const marker = '<!-- kover-coverage -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number },
            );
            const mine = existing.find((c) => c.body.includes(marker));
            // Edited in place: one comment that tracks the branch, rather than a
            // new one on every push turning the conversation into a changelog.
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/reports/kover/html
          retention-days: 14

  sample:
    name: sample
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The sample is a standalone build that resolves the artifacts from a
      # repository, which is the only way to find out whether the published
      # artifacts work together rather than whether the source tree does.
      - name: Publish the plugin and the JVM variants it needs
        run: |
          ./gradlew \
            :kotlinx-locale-gradle-plugin:publishToMavenLocal \
            :kotlinx-locale-codegen-emitters:publishToMavenLocal \
            :kotlinx-locale-codegen-data:publishToMavenLocal
          # Every artifact the sample resolves, including the ones it reaches
          # only transitively: currency-core and datetime-cldr-runtime both
          # depend on number-core through api, so it is on the sample's compile
          # classpath without being named in its build file.
          ./gradlew $(for m in core types country-types country-core country-cldr-runtime \
                                currency-types currency-core currency-cldr-runtime \
                                number-core number-cldr-runtime \
                                datetime-core datetime-cldr-runtime; do
            printf ':kotlinx-locale-%s:publishKotlinMultiplatformPublicationToMavenLocal ' "$m"
            printf ':kotlinx-locale-%s:publishJvmPublicationToMavenLocal ' "$m"
          done)
      - name: Build the narrowed sample against them
        run: ./gradlew -p samples/narrowed build

  abi:
    name: abi
    # macOS is the only host that can compile every target, so it is the only
    # one where the comparison covers the whole published ABI.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Check the public ABI against the committed dumps
        run: ./gradlew checkKotlinAbi

  test:
    # One target per job, rather than one host running everything it can.
    #
    # `./gradlew build` on three hosts gave three results for twenty-five
    # targets, so a failure named the host and left the target to be guessed at,
    # and a Kotlin/Native link that exhausted its heap took the other twenty-four
    # down with it. Split out, each target passes or fails on its own and the job
    # name is the answer.
    #
    # `task` is what that target can actually be asked for. A target whose tests
    # this host can execute runs them; the rest compile, which is all a
    # cross-compiled target can be held to.
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runs its own tests on any host.
          - { target: jvm, os: ubuntu-latest, task: jvmTest }
          - { target: js, os: ubuntu-latest, task: jsTest }
          - { target: wasmJs, os: ubuntu-latest, task: wasmJsTest }
          # Compile only. The test framework's data layer does not publish a
          # wasm-wasi variant, so this target has no test compilation; see the
          # note in kotlinx-locale-multiplatform-base. The klib task is what
          # keeps the target from silently rotting in the meantime.
          - { target: wasmWasi, os: ubuntu-latest, task: compileKotlinWasmWasi }
          - { target: androidLibrary, os: ubuntu-latest, task: testAndroidHostTest }

          # Native, host-executable.
          - { target: linuxX64, os: ubuntu-latest, task: linuxX64Test }
          - { target: mingwX64, os: windows-latest, task: mingwX64Test }
          - { target: macosArm64, os: macos-latest, task: macosArm64Test }
          - { target: iosSimulatorArm64, os: macos-latest, task: iosSimulatorArm64Test }
          - { target: tvosSimulatorArm64, os: macos-latest, task: tvosSimulatorArm64Test }
          - { target: watchosSimulatorArm64, os: macos-latest, task: watchosSimulatorArm64Test }

          # Native, cross-compiled: built and linked, never run, because no
          # runner has the hardware or the simulator.
          - { target: linuxArm64, os: ubuntu-latest, task: linuxArm64MainKlibrary }
          - { target: androidNativeArm32, os: ubuntu-latest, task: androidNativeArm32MainKlibrary }
          - { target: androidNativeArm64, os: ubuntu-latest, task: androidNativeArm64MainKlibrary }
          - { target: androidNativeX86, os: ubuntu-latest, task: androidNativeX86MainKlibrary }
          - { target: androidNativeX64, os: ubuntu-latest, task: androidNativeX64MainKlibrary }
          - { target: iosArm64, os: macos-latest, task: iosArm64MainKlibrary }
          - { target: iosX64, os: macos-latest, task: iosX64MainKlibrary }
          - { target: tvosArm64, os: macos-latest, task: tvosArm64MainKlibrary }
          - { target: tvosX64, os: macos-latest, task: tvosX64MainKlibrary }
          - { target: watchosArm32, os: macos-latest, task: watchosArm32MainKlibrary }
          - { target: watchosArm64, os: macos-latest, task: watchosArm64MainKlibrary }
          - { target: watchosDeviceArm64, os: macos-latest, task: watchosDeviceArm64MainKlibrary }
          - { target: watchosX64, os: macos-latest, task: watchosX64MainKlibrary }
          - { target: macosX64, os: macos-latest, task: macosX64MainKlibrary }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }}

  # One name for the branch rule to require, so adding a target to the matrix
  # does not mean editing the protection settings. It fails when any target
  # does, including one that was skipped or cancelled.
  test-matrix:
    name: test
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Fail unless every target succeeded
        run: |
          echo "result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
