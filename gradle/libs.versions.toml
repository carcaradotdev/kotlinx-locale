[versions]
kotlin = "2.4.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
agp = "9.3.0"
android-compileSdk = "36"
android-minSdk = "21"
ktlint-gradle = "14.2.0"
maven-publish = "0.37.0"
kover = "0.9.9"
# The suffix names the Kotlin release the compiler plugin was built for, so this
# and `kotlin` above move together. Every de.infix.testBalloon artifact in one
# build has to carry the same version.
testballoon = "1.0.1-K2.4.0"
# The data and property layers on top of TestBalloon. Published for twenty-four
# of this build's twenty-five targets; see the wasmWasi note in
# `kotlinx-locale-multiplatform-base` for the one it omits.
testballoon-addons = "0.16.0"
# Reached through the addon, which needs its own assertion vocabulary. Pinned
# here rather than left transitive so a version bump is a visible edit.
kotest = "6.0.4"
# Matches ICU_REPO.tag in Repos.kt: the goldens the skeleton matcher is held to
# have to come from the same ICU release the CLDR data is pinned against.
icu4j = "78.3"
# Pinned to the same release :codegen clones; PhoneMetadata cross-checks the two.
libphonenumber = "9.0.19"

[libraries]
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# The test framework. The Gradle plugin instruments the compilation but does not
# put the framework on the classpath, so this is declared for every test source
# set by `kotlinx-locale-multiplatform-base` rather than being implied.
#
# `matrix` is what makes a case set readable: it turns a list of fixtures into
# one reported node per locale instead of one accumulated string per domain.
# `compact` bounds what that costs, which matters at eleven hundred locales.
# The Android host test compilation only. TestBalloon integrates there through a
# JUnit 4 runner, and JUnit 4 used to arrive transitively with kotlin-test; with
# kotlin-test gone the runner has nothing to register with and the task discovers
# no tests at all.
junit4 = { module = "junit:junit", version = "4.13.2" }

testballoon-framework-core = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testballoon" }
testballoon-matrix = { module = "at.asitplus.testballoon:matrix", version.ref = "testballoon-addons" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

# The Gradle plugin's tests only, so that the source each feature generates is
# compiled rather than pattern-matched. Nothing published depends on it.
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }

# The runtime the -serialization modules compile against, and the only thing they
# need: their serializers are hand-written, so no module here applies the
# serialization compiler plugin to its main sources. The Json format is a test
# dependency, since a serializer is only proved by a round trip through a format.
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# :codegen only, and :codegen runs at build time and ships nothing. Used to
# generate the skeleton goldens; no published artifact depends on ICU, and
# nothing in the runtime delegates to it.
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }

# Plugin artifacts for the buildSrc classpath; modules apply plugins by id
# (versionless) through the kotlinx-locale-multiplatform convention plugin.
gradle-plugin-kotlin-multiplatform = { module = "org.jetbrains.kotlin.multiplatform:org.jetbrains.kotlin.multiplatform.gradle.plugin", version.ref = "kotlin" }
gradle-plugin-android-kmp-library = { module = "com.android.kotlin.multiplatform.library:com.android.kotlin.multiplatform.library.gradle.plugin", version.ref = "agp" }
gradle-plugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
gradle-plugin-kotlin-serialization = { module = "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
gradle-plugin-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
gradle-plugin-testballoon = { module = "de.infix.testBalloon:testBalloon-gradle-plugin", version.ref = "testballoon" }
gradle-plugin-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
