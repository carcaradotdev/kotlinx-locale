group=dev.carcara
version=0.1.0-SNAPSHOT

org.gradle.jvmargs=-Xmx4G -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Linking the test binaries runs the Kotlin/Native compiler in its own JVM, one
# per target, and each carries the conformance fixtures: a few megabytes of
# generated source pulled into every Apple and Linux binary. The line above does
# not reach those JVMs, and their default heap is not enough.
#
# The worker cap goes with it and is the half that is easy to miss. Four
# gigabytes each is fine for one link and ruinous for fourteen at once, which is
# what a machine with fourteen cores will otherwise start. Raising the heap
# without bounding the concurrency moved the failure from one target to another
# rather than fixing it.
#
# Four is also roughly what the CI runners have, so the number that keeps a
# developer machine inside its memory is the number CI was going to use anyway.
kotlin.native.jvmArgs=-Xmx4G -XX:+UseParallelGC
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

kotlin.code.style=official
