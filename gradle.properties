group=dev.carcara
version=0.1.0-SNAPSHOT

# Everything the published POM says about the project, in one place rather than
# in the convention plugin that reads it. Maven Central rejects a deployment
# whose POM is missing any of these, so the plugin fails the build at
# configuration when one is absent rather than at the end of a release.
#
# The name of a module is its Gradle project name, and its description is the
# one the module's own build file sets. POM_DESCRIPTION below is the fallback
# for a module that sets none.
POM_DESCRIPTION=Locale support for Kotlin Multiplatform, written entirely in common Kotlin
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/carcaradotdev/kotlinx-locale

POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

# One developer. A second is not another property: the POM takes a list, and
# the convention plugin would need a real change to write one.
POM_DEVELOPER_ID=DevSrSouza
POM_DEVELOPER_NAME=Gabriel Souza
POM_DEVELOPER_URL=https://github.com/DevSrSouza

POM_SCM_URL=https://github.com/carcaradotdev/kotlinx-locale
POM_SCM_CONNECTION=scm:git:git://github.com/carcaradotdev/kotlinx-locale.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/carcaradotdev/kotlinx-locale.git

# Every JVM this build starts has an explicit ceiling, and the ceilings add up
# to something a developer machine can hold. There are four of them and only one
# used to be written down, which is how a build that looked bounded could still
# take a machine to its knees:
#
#   Gradle daemon            2G   (org.gradle.jvmargs, below)
#   Kotlin daemon            3G   (kotlin.daemon.jvmargs, below)
#   Kotlin/Native compiler   3G   x org.gradle.workers.max
#   each Test task           1G   (maxHeapSize, in the convention plugins;
#                                  :conformance-icu raises its own to 3G)
#
# At the cap that is about 12 GB. Left implicit, the Kotlin daemon inherits
# org.gradle.jvmargs and a Test task takes a quarter of physical memory, so the
# same build on a large machine reserves several times that and spends the
# difference swapping.
org.gradle.jvmargs=-Xmx2G -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Not inherited from the line above, and not the Gradle daemon: this is the
# process that actually compiles Kotlin. Unset, it takes whatever the Gradle
# daemon was given, which doubles the largest number in the build without
# anyone choosing to.
kotlin.daemon.jvmargs=-Xmx3G -XX:+UseParallelGC

# Linking the test binaries runs the Kotlin/Native compiler in its own JVM, one
# per target, and none of the lines above reach those JVMs.
#
# This used to be 4G with four workers, because each binary carried the shared
# conformance fixtures: a few megabytes of generated source pulled into every
# Apple and Linux link. Those fixtures now live in the one module that reads
# each of them, so a link carries its own domain and not five others, and the
# heap that took needed to come down with it.
#
# The worker cap is the half that is easy to miss. Three gigabytes each is fine
# for one link and ruinous for fourteen at once, which is what a machine with
# fourteen cores will otherwise start. Raising the heap without bounding the
# concurrency moves the failure from one target to another rather than fixing it.
kotlin.native.jvmArgs=-Xmx3G -XX:+UseParallelGC
org.gradle.workers.max=2

org.gradle.caching=true

# Parallel project execution, bounded by the worker cap above. The cap is what
# makes this safe: without it, parallel means one Kotlin/Native compiler per
# core, each holding its own heap.
org.gradle.parallel=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# A test's reported path is its suite name, then every nested element name, then
# the case. On Native and wasmWasi that path becomes part of a report file name,
# and a locale tag plus a skeleton plus a suite name runs past what a file system
# will take. The way that arrives is one target failing with "file name too long"
# while the rest pass, so truncate in the framework instead.
testBalloon.reportingPathLimit=200
